<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up a widget · ftc-embeds</title>
<meta name="description" content="Put FTC data on your website in a few steps: answer a few questions, see it live, copy the code with instructions for your website builder.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231c1b19'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23ff5a1f'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%23f4f1ea'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%23f4f1ea'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23f4f1ea'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
    :root {
        --paper: #f4f1ea;
        --paper-2: #ebe6db;
        --ink: #1c1b19;
        --ink-2: #5d5a53;
        --rule: #cfc8b8;
        --grid: rgba(28, 27, 25, 0.016);
        --accent: #ff5a1f;
        --accent-ink: #1c1b19;
        --field: #fbf9f4;
        --code-bg: #1c1b19;
        --code-ink: #ece7dc;
        --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --paper: #161512;
            --paper-2: #1f1e1a;
            --ink: #ece7dc;
            --ink-2: #a39d90;
            --rule: #3a3731;
            --grid: rgba(236, 231, 220, 0.018);
            --field: #1b1a17;
            --code-bg: #0e0d0b;
            color-scheme: dark;
        }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--paper); }
    body {
        margin: 0;
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        background-color: var(--paper);
        background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px;
    }
    a { color: inherit; text-underline-offset: 3px; }
    a:hover { color: var(--accent); }

    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 14px 28px; border-bottom: 2px solid var(--ink); }
    .wordmark { font: 500 17px var(--mono); text-decoration: none; letter-spacing: -0.02em; }
    .wordmark b { font-weight: 500; color: var(--accent); }
    .top nav { display: flex; gap: 20px; font: 13px var(--mono); }
    .top nav a { text-decoration: none; color: var(--ink-2); }
    .top nav a:hover, .top nav a[aria-current] { color: var(--ink); }

    /* Progress: one cell per step; done steps are links back. */
    .progress { display: flex; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
    .progress a, .progress span { flex: 1 0 auto; padding: 10px 16px 9px; font: 12px var(--mono); color: var(--ink-2); text-decoration: none; border-right: 1px solid var(--rule); white-space: nowrap; border-bottom: 3px solid transparent; }
    .progress a:hover { color: var(--ink); background: var(--paper-2); }
    .progress .done { color: var(--ink); }
    .progress .done::before { content: "✓ "; color: var(--accent); }
    .progress [aria-current="step"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
    .progress .todo { opacity: .55; }

    .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); max-width: 1320px; margin: 0 auto; min-height: calc(100vh - 160px); }
    .stage.solo { grid-template-columns: minmax(0, 1fr); max-width: 980px; }
    .ask { padding: 40px 28px 48px; min-width: 0; }
    .stage:not(.solo) .ask { border-right: 1px solid var(--rule); }
    .kicker { font: 12px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
    .ask h1 { margin: 8px 0 8px; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; letter-spacing: -0.025em; }
    .ask > p.sub { margin: 0 0 28px; color: var(--ink-2); max-width: 54ch; font-size: 16px; }
    .q { margin: 26px 0 10px; font-weight: 600; font-size: 15px; }
    .q small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }

    /* Big choice cards: radio buttons in disguise. */
    .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .choices.two { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .choices.small { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .choice { position: relative; display: grid; gap: 4px; align-content: start; text-align: left; padding: 16px 16px 15px; border: 1px solid var(--rule); background: var(--field); color: var(--ink); font: inherit; border-radius: 2px; cursor: pointer; transition: border-color .12s, transform .12s; }
    .choices.small .choice { padding: 11px 12px; }
    .choice:hover { border-color: var(--ink); }
    .choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--paper); }
    .choice[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 10px; right: 12px; font: 600 13px var(--mono); color: var(--accent); }
    .choice b { font-size: 16px; font-weight: 600; padding-right: 18px; }
    .choices.small .choice b { font-size: 14px; }
    .choice span { font-size: 13.5px; color: var(--ink-2); }
    .choice .ico { font-size: 22px; line-height: 1; margin-bottom: 6px; }
    .choice .tag { justify-self: start; margin-top: 6px; font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); background: var(--accent); padding: 1px 6px; border-radius: 2px; }
    .swatch { display: flex; height: 26px; margin: 0 20px 8px 0; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
    .swatch i { flex: 1; }

    label.f { display: grid; gap: 5px; font-size: 13px; color: var(--ink-2); }
    .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    .row > * { min-width: 0; }
    input[type="text"], input[type="number"], select {
        width: 100%; font: 16px var(--sans); color: var(--ink); background: var(--field);
        border: 1px solid var(--rule); border-radius: 2px; padding: 9px 11px; outline: none;
    }
    input.big { font: 500 28px var(--mono); padding: 10px 14px; letter-spacing: .02em; }
    input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    input[type="color"] { width: 44px; height: 38px; padding: 2px; border: 1px solid var(--rule); border-radius: 2px; background: var(--field); cursor: pointer; }
    input[type="checkbox"] { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
    .check { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; padding: 6px 0; }
    .hint { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
    .status { margin-top: 12px; font: 13px var(--mono); color: var(--ink-2); min-height: 20px; }
    .status.ok { color: var(--ink); }
    .status.ok::before { content: "✓ "; color: var(--accent); }
    .status.bad { color: var(--accent); }

    .stats-pick { display: flex; flex-wrap: wrap; gap: 6px; }
    .stats-pick label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; border: 1px solid var(--rule); padding: 5px 10px; border-radius: 2px; cursor: pointer; background: var(--field); }
    .stats-pick label:has(input:checked) { border-color: var(--ink); background: var(--paper-2); }
    .stats-pick label[data-order]:not([data-order=""])::after { content: attr(data-order); font: 11px var(--mono); color: var(--accent); }

    .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--rule); }
    .btn { display: inline-block; font: 500 15px var(--sans); border: 1px solid var(--ink); border-radius: 2px; background: none; color: var(--ink); padding: 10px 18px; cursor: pointer; text-decoration: none; }
    .btn:hover { background: var(--paper-2); color: var(--ink); }
    .btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.go:hover { filter: brightness(1.05); background: var(--accent); }
    .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
    .btn.quiet { border-color: transparent; color: var(--ink-2); padding-left: 0; }
    .btn.quiet:hover { background: none; color: var(--accent); }
    .btn.sm { font-size: 13px; padding: 6px 11px; }

    .side { padding: 40px 28px; min-width: 0; }
    .side-inner { position: sticky; top: 20px; }
    .side .label { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .preview { border: 2px solid var(--ink); background: var(--field); padding: 20px; min-height: 240px; max-height: 70vh; overflow: auto; }
    .preview.on-dark { background: #11151c; }
    .preview.map { padding: 0; height: 520px; overflow: hidden; position: relative; }

    /* Last step */
    .steps { counter-reset: s; list-style: none; margin: 0 0 22px; padding: 0; }
    .steps li { counter-increment: s; position: relative; padding: 9px 0 9px 38px; border-top: 1px solid var(--rule); }
    .steps li::before { content: counter(s); position: absolute; left: 0; top: 8px; width: 24px; height: 24px; display: grid; place-items: center; font: 500 12px var(--mono); background: var(--ink); color: var(--paper); border-radius: 2px; }
    .steps code, .hint code { font: 13px var(--mono); background: var(--paper-2); padding: 1px 5px; border-radius: 2px; }
    .code-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-top: 8px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
    .tabs { display: flex; gap: 18px; flex-wrap: wrap; }
    .tabs button { border: 0; background: none; padding: 0 0 8px; margin-bottom: -1px; font: 13px var(--sans); color: var(--ink-2); border-bottom: 2px solid transparent; cursor: pointer; }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
    pre { margin: 12px 0 0; background: var(--code-bg); color: var(--code-ink); padding: 16px 18px; overflow: auto; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 340px; border-radius: 2px; }
    .done-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .recap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 14px; margin: 0 0 26px; font-size: 14px; }
    .recap dt, .recap dd { padding: 7px 0; border-top: 1px solid var(--rule); margin: 0; }
    .recap dt { color: var(--ink-2); font: 12px/1.9 var(--mono); }
    .recap dd a { font: 12px var(--mono); color: var(--ink-2); }

    footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 28px 28px; border-top: 2px solid var(--ink); font: 12px/1.6 var(--mono); color: var(--ink-2); }

    @media (max-width: 920px) {
        .top, .ask, .side, footer { padding-left: 16px; padding-right: 16px; }
        .stage { grid-template-columns: minmax(0, 1fr); min-height: 0; }
        .stage:not(.solo) .ask { border-right: 0; border-bottom: 1px solid var(--rule); }
        .ask { padding-top: 28px; padding-bottom: 32px; }
        .side { padding-top: 24px; }
        .preview.map { height: 60vh; }
        .top { flex-wrap: wrap; row-gap: 8px; }
        .top nav { flex-wrap: wrap; gap: 6px 16px; }
    }
</style>
</head>
<body>
<header class="top">
    <a class="wordmark" href="/">ftc<b>-</b>embeds</a>
    <nav>
        <a href="/setup" aria-current="page">setup</a>
        <a href="/pit-map">pit map</a>
        <a href="/team">team widgets</a>
        <a href="https://github.com/mmathijs/ftc-embeds#readme">docs</a>
        <a href="/stats">stats</a>
    </nav>
</header>

<nav class="progress" id="progress" aria-label="Steps"></nav>

<div class="stage" id="stage">
    <section class="ask" id="ask"></section>
    <aside class="side" id="side">
        <div class="side-inner">
            <div class="label"><span id="preview-label">Live preview</span><span id="preview-note"></span></div>
            <div class="preview" id="preview"></div>
        </div>
    </aside>
</div>

<footer>
    <span>Made for the FTC community by <a href="https://github.com/mmathijs">mmathijs</a>. Open source, MIT license.</span>
    <span>Prefer every option at once? <a href="/team">Team widgets</a> · <a href="/pit-map">Pit map</a></span>
</footer>

<script src="config.js"></script>
<script src="examples/events.js"></script>
<script src="lib/pit-map.umd.js"></script>
<script src="lib/team-card.umd.js"></script>
<script src="lib/team-results.umd.js"></script>
<script src="lib/team-awards.umd.js"></script>
<script src="lib/next-match.umd.js"></script>
<script src="lib/team-season.umd.js"></script>
<script src="setup.js"></script>
</body>
</html>
