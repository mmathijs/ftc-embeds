<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pit map</title>
<style>
    html, body { margin: 0; height: 100%; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: fixed; inset: 0; }
    .credit { position: fixed; left: 8px; bottom: 6px; z-index: 5; font-size: 11px; opacity: .65; color: inherit; text-decoration: none; }
    .credit:hover { opacity: 1; text-decoration: underline; }
</style>
</head>
<body>
<div id="map"></div>
<a class="credit" href="https://ftc-embeds.com" target="_blank" rel="noopener">ftc-embeds</a>
<script src="../config.js"></script>
<script src="../lib/pit-map.umd.js"></script>
<script>
    // Renders one pit map from URL parameters; see the dashboard on ftc-embeds.com for the
    // parameter names (they mirror the web component's attributes).
    const { PitMap, configure } = FtcPitMap;
    const q = new URLSearchParams(location.search);
    const flag = (name, dflt) => (q.has(name) ? !["0", "false", "no"].includes(q.get(name)) : dflt);
    const site = window.FTC_EMBEDS_SITE || {};

    let theme = q.get("theme") || "auto";
    if (/^\s*\{/.test(theme)) {
        try {
            theme = JSON.parse(theme);
        } catch {
            theme = "auto";
        }
    }
    const themeName = typeof theme == "string" ? theme : theme.base || "auto";
    document.body.style.colorScheme = themeName == "auto" || themeName.endsWith("-auto") ? "light dark" : themeName.endsWith("dark") ? "dark" : "light";

    const options = {
        theme,
        highlight: q.get("highlight") || null,
        outline: q.get("outline") || null,
        highlightColor: q.get("highlightColor") || null,
        outlineColor: q.get("outlineColor") || null,
        dimOthers: flag("dimOthers", true),
        pulse: flag("pulse", true),
        controls: flag("controls", true),
        scrollZoom: q.get("scrollZoom") == "true" ? true : q.get("scrollZoom") == "false" ? false : "modifier",
        showTeamNames: q.get("showTeamNames") == "true" ? true : q.get("showTeamNames") == "false" ? false : "zoom",
        clickAction: q.get("clickAction") || "popup",
        fieldAlliances: q.get("fieldAlliances") || null,
        onPitClick: ({ team }) => team && parent !== window && parent.postMessage({ type: "ftc-embeds:pitclick", team }, "*"),
    };

    const event = q.get("event");
    const focus = q.get("focus");
    const map = new PitMap(document.getElementById("map"), options);
    map.on("load", () => focus && map.focusTeam(focus, { flash: false }));

    function loadExample(code) {
        return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = "../examples/events.js";
            s.onload = () => (window.PIT_MAPS && window.PIT_MAPS[code] ? resolve(window.PIT_MAPS[code]) : reject(new Error("unknown example")));
            s.onerror = reject;
            document.head.appendChild(s);
        });
    }

    if (q.get("source") == "example" && event) {
        loadExample(event.split("/").pop().toUpperCase())
            .then((data) => {
                map.setData(data);
                if (focus) map.focusTeam(focus, { flash: false });
            })
            .catch(() => {
                const msg = document.createElement("p");
                msg.textContent = "No example pit map for this event.";
                msg.style.cssText = "position:fixed;inset:0;display:grid;place-items:center;margin:0;opacity:.7";
                document.body.appendChild(msg);
            });
    } else if (event) {
        configure({ apiBase: q.get("apiBase") || site.apiBase || null, graphqlUrl: q.get("graphqlUrl") || site.graphqlUrl || null });
        map.load(event);
    }
</script>
</body>
</html>
