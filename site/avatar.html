<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Milestone 1 of the avatar maker: not linked from the site yet. The full page replaces this. -->
<meta name="robots" content="noindex">
<title>Team avatar · ftc-embeds</title>
<meta name="description" content="Turn your team's logo into the 40×40 PNG avatar FIRST shows at events. It all happens in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231c1b19'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23ff5a1f'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%23f4f1ea'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%23f4f1ea'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23f4f1ea'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
    :root {
        --paper: #f4f1ea;
        --paper-2: #ebe6db;
        --ink: #1c1b19;
        --ink-2: #5d5a53;
        --rule: #cfc8b8;
        --accent: #ff5a1f;
        --accent-ink: #1c1b19;
        --field: #fbf9f4;
        --check-a: #ffffff;
        --check-b: #e3ded2;
        --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --paper: #161512;
            --paper-2: #1f1e1a;
            --ink: #ece7dc;
            --ink-2: #a39d90;
            --rule: #3a3731;
            --field: #1b1a17;
            --check-a: #2a2925;
            --check-b: #1f1e1a;
            color-scheme: dark;
        }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--paper); }
    body { margin: 0; color: var(--ink); font: 15px/1.5 var(--sans); background: var(--paper); }
    a { color: inherit; text-underline-offset: 3px; }
    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 14px 28px; border-bottom: 2px solid var(--ink); }
    .wordmark { font: 500 17px var(--mono); text-decoration: none; letter-spacing: -0.02em; }
    .wordmark b { font-weight: 500; color: var(--accent); }
    main { max-width: 980px; margin: 0 auto; padding: 32px 28px 48px; }
    h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: -0.02em; }
    .lede { margin: 0 0 24px; color: var(--ink-2); max-width: 60ch; }
    .drop { display: grid; place-items: center; gap: 10px; min-height: 160px; padding: 24px; border: 2px dashed var(--ink-2); background: var(--field); text-align: center; }
    .drop.over { border-color: var(--accent); }
    .hint { margin: 0; font-size: 13px; color: var(--ink-2); }
    .error { color: var(--accent); min-height: 1.5em; margin: 8px 0 0; }
    .btn { font: 500 14px var(--sans); border: 1px solid var(--ink); border-radius: 2px; background: none; color: var(--ink); padding: 7px 14px; cursor: pointer; }
    .btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .file input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    h2 { margin: 32px 0 10px; font-size: 18px; }
    .strip .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .strip .row > span:first-child { width: 96px; font: 12px var(--mono); color: var(--ink-2); }
    .bg { display: grid; place-items: center; width: 56px; height: 56px; border: 1px solid var(--rule); }
    .bg img { display: block; width: 40px; height: 40px; }
    .zoom { width: 240px; height: 240px; image-rendering: pixelated; border: 1px solid var(--rule); margin-left: 12px; }
    .checker { background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px; }
    .checks { list-style: none; margin: 0; padding: 0; }
    .checks li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--rule); }
    .checks b { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; min-width: 110px; }
    .checks .error b { color: var(--accent); }
    .downloads { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .size { font: 12px var(--mono); color: var(--ink-2); margin-right: 12px; }
    @media (max-width: 560px) {
        .top, main { padding-left: 16px; padding-right: 16px; }
        .zoom { margin-left: 0; width: 200px; height: 200px; }
    }
</style>
</head>
<body>
<header class="top">
    <a class="wordmark" href="/">ftc<b>-</b>embeds</a>
</header>
<main>
    <h1>Make your team's avatar</h1>
    <p class="lede">Turn your logo into the 40×40 PNG FIRST shows at events. It all happens in your browser; your logo is never uploaded.</p>

    <label class="drop" id="drop">
        <span id="drop-text"></span>
        <span class="btn go file">Choose file<input type="file" id="file" accept="image/*,.svg"></span>
        <span class="hint" id="private"></span>
    </label>
    <p class="hint" id="status" aria-live="polite"></p>
    <p class="error" id="error" role="alert"></p>

    <section id="result" hidden>
        <h2>Your avatar</h2>
        <div class="strip" id="strip"></div>

        <h2>Checks</h2>
        <ul class="checks" id="checks" aria-live="polite"></ul>

        <h2>Download</h2>
        <div class="downloads">
            <button type="button" class="btn go" id="dl-opaque"></button><span class="size" id="size-opaque"></span>
            <button type="button" class="btn" id="dl-transparent"></button><span class="size" id="size-transparent"></span>
        </div>
    </section>
    <p class="hint" id="worker" style="margin-top:32px"></p>
</main>
<script type="module" src="avatar.js"></script>
</body>
</html>
