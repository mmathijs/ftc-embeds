<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <!-- An original example logo for ftc-embeds.com/avatar ("Try an example"), drawn for this repo:
       a robot mascot with a separate two-colour name banner on a white background. Not a real team's logo. -->
  <rect width="1200" height="1000" fill="#ffffff"/>
  <g stroke="#1b2140" stroke-width="18" stroke-linejoin="round">
    <line x1="600" y1="70" x2="600" y2="150" stroke-linecap="round"/>
    <circle cx="600" cy="62" r="30" fill="#ff5a1f"/>
    <rect x="390" y="150" width="420" height="300" rx="70" fill="#2e9e8f"/>
    <rect x="455" y="225" width="290" height="140" rx="40" fill="#e8f4f1"/>
    <rect x="560" y="440" width="80" height="40" fill="#257f73"/>
    <rect x="430" y="470" width="340" height="230" rx="40" fill="#2e9e8f"/>
    <rect x="345" y="500" width="95" height="170" rx="36" fill="#257f73"/>
    <rect x="760" y="500" width="95" height="170" rx="36" fill="#257f73"/>
    <circle cx="520" cy="590" r="40" fill="#ff5a1f"/>
    <circle cx="680" cy="590" r="40" fill="#ff5a1f"/>
  </g>
  <circle cx="540" cy="295" r="34" fill="#1b2140"/>
  <circle cx="660" cy="295" r="34" fill="#1b2140"/>
  <circle cx="552" cy="283" r="11" fill="#ffffff"/>
  <circle cx="672" cy="283" r="11" fill="#ffffff"/>
  <g stroke="#1b2140" stroke-width="14">
    <rect x="170" y="790" width="430" height="140" fill="#1f4e9c"/>
    <rect x="600" y="790" width="430" height="140" fill="#7fc2ea"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="78" text-anchor="middle">
    <text x="385" y="895" fill="#ffffff">EXAMPLE</text>
    <text x="815" y="895" fill="#1b2140">BOTS</text>
  </g>
</svg>
