name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write # GitHub release
    id-token: write # npm trusted publishing and provenance

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: Check the tag matches package.json
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
                      exit 1
                  fi
            - run: npm run build
            - run: npm test
            - run: npm run typecheck
            # Trusted publishing needs npm 11.5.1 or newer.
            - run: npm install -g npm@latest
            - name: Publish to npm
              env:
                  # Only needed for the first release, before trusted publishing is set up.
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  name=$(node -p "require('./package.json').name")
                  version=$(node -p "require('./package.json').version")
                  if npm view "$name@$version" version >/dev/null 2>&1; then
                      echo "$name@$version is already on npm, skipping"
                  elif npm view "$name" name >/dev/null 2>&1; then
                      npm publish
                  else
                      # A new package can only be created through staged publishing; a maintainer
                      # then approves it with 2FA on npmjs.com (or npm stage approve).
                      npm stage publish
                      echo "::notice::$name@$version is staged: approve it on npmjs.com to make it installable"
                  fi
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      echo "Release $GITHUB_REF_NAME already exists, skipping"
                  else
                      gh release create "$GITHUB_REF_NAME" dist/*.mjs dist/*.js dist/*.html --title "$GITHUB_REF_NAME" --generate-notes
                  fi
