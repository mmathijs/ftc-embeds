name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write # GitHub release
    id-token: write # npm trusted publishing and provenance

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: Check the tag matches package.json
              id: version
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
                      exit 1
                  fi
                  # 1.2.0 -> latest, 1.2.0-beta.1 -> beta, 1.2.0-rc.2 -> rc, 1.2.0-1 -> next
                  if [[ "$version" == *-* ]]; then
                      id=${version#*-}
                      id=${id%%.*}
                      [[ "$id" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]] || id=next
                      echo "dist_tag=$id" >> "$GITHUB_OUTPUT"
                      echo "prerelease=true" >> "$GITHUB_OUTPUT"
                  else
                      # An older line (release-0.9): never move "latest".
                      echo "dist_tag=release-0.9" >> "$GITHUB_OUTPUT"
                      echo "prerelease=false" >> "$GITHUB_OUTPUT"
                  fi
            - run: npm ci
            - run: npm run build
            - run: npm test
            - run: npm run typecheck
            # Trusted publishing needs npm 11.5.1 or newer.
            - run: npm install -g npm@latest
            - name: Publish to npm
              env:
                  DIST_TAG: ${{ steps.version.outputs.dist_tag }}
              run: |
                  name=$(node -p "require('./package.json').name")
                  version=$(node -p "require('./package.json').version")
                  if npm view "$name@$version" version >/dev/null 2>&1; then
                      echo "$name@$version is already on npm, skipping"
                  else
                      npm publish --tag "$DIST_TAG"
                  fi
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRERELEASE: ${{ steps.version.outputs.prerelease }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      echo "Release $GITHUB_REF_NAME already exists, skipping"
                  else
                      flags=(--latest=false)
                      [ "$PRERELEASE" = true ] && flags+=(--prerelease)
                      gh release create "$GITHUB_REF_NAME" dist/*.mjs dist/*.js dist/*.html --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
                  fi
