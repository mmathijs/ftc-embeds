name: New version

# Actions -> New version -> Run workflow: pick patch, minor or major. It checks main (build, tests,
# types), bumps package.json and package-lock.json like `npm version`, pushes the commit ("0.29.2")
# and its tag (v0.29.2) to main, and then starts Release for that tag (npm and the GitHub release).
# A tag pushed with the workflow's own token doesn't start other workflows by itself, so Release is
# started explicitly.

on:
    workflow_dispatch:
        inputs:
            bump:
                description: "Which part of the version to raise"
                type: choice
                options: [patch, minor, major]
                default: patch

permissions:
    contents: write # push the commit and the tag
    actions: write # start the Release workflow

concurrency:
    group: new-version
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-latest
        steps:
            - name: Only from main
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "Run this from main (it was started on $GITHUB_REF_NAME)."
                  exit 1
            - uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - run: npm run build
            - run: npm test
            - run: npm run typecheck
            - name: Bump the version
              id: bump
              env:
                  BUMP: ${{ inputs.bump }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  # The commit message is the bare version, like the earlier releases.
                  tag=$(npm version "$BUMP" -m "%s")
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "New version: $tag"
            - name: Push the commit and the tag
              env:
                  TAG: ${{ steps.bump.outputs.tag }}
              run: git push --atomic origin HEAD:main "$TAG"
            - name: Start the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.bump.outputs.tag }}
              run: |
                  gh workflow run release.yml --ref "$TAG"
                  echo "### $TAG" >> "$GITHUB_STEP_SUMMARY"
                  echo "Pushed to main and tagged. Release is publishing it: see the Release workflow." >> "$GITHUB_STEP_SUMMARY"
